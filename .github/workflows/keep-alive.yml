# Supabase pauses free projects after about a week with no activity.
# This pings the database API every 3 days so the gym app stays online.
# Add two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              e.g. https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the sb_publishable_... key (safe to use here)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets not set; skipping."
            exit 0
          fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/plans?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
